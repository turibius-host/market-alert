name: Market Alert

on:
  schedule:
    - cron: "*/10 * * * *"      # every 10 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:             # lets you press "Run workflow" by hand

permissions:
  contents: write                # needed to save the data branch

concurrency:
  group: market-alert            # never run two copies at once
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Restore saved data from the "state" branch
        run: |
          mkdir -p data
          if git fetch --depth=1 origin state; then
            git archive FETCH_HEAD | tar -x -C data
          else
            echo "No saved data yet - this is the first run."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Run the market alert
        env:
          PYTHONUNBUFFERED: "1"
          MARKET_ALERT_DIR: data
          MARKET_ALERT_DASHBOARD: index.html
          MARKET_ALERT_TZ: Asia/Singapore      # change if you want times in another timezone
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_RECIPIENT: ${{ secrets.ALERT_RECIPIENT }}
        run: python market_alert.py

      - name: Save data and publish the dashboard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd data
          touch .nojekyll
          git init -q -b state
          git config user.name "market-alert-bot"
          git config user.email "market-alert-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" state
